<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DEXTRO DASH 2000 - playable prototype</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23100b28'/><circle cx='16' cy='16' r='10' fill='%237d24b7'/><circle cx='13' cy='13' r='2' fill='white'/><circle cx='20' cy='13' r='2' fill='white'/><path d='M11 20 Q16 24 22 19' fill='none' stroke='%237cf5ff' stroke-width='2' stroke-linecap='round'/></svg>">
    <link rel="stylesheet" href="style.css?v=0.1.4-hd2">
</head>
<body>
    <main class="game-page">
        <section class="game-cabinet" aria-label="DEXTRO DASH 2000">
            <canvas
                id="gameCanvas"
                width="1920"
                height="1080"
                tabindex="0"
                aria-label="Playable platform game. Use the left and right arrow keys to run, the up arrow to jump, Z to release stored pump insulin, and A to eat candy.">
            </canvas>

            <div id="gameOverlay" class="game-overlay title-screen">
                <p class="title-kicker">A PHYSIOLOGY-POWERED ARCADE</p>
                <h1 id="overlayTitle">DEXTRO DASH 2000</h1>
                <p id="overlaySubtitle">STAGE 01</p>
                <div class="title-keyboard-map" aria-label="Keyboard controls: A, Z and arrow keys">
                    <div class="action-key-cluster" aria-hidden="true">
                        <span class="keyboard-group-label">ACTIONS</span>
                        <kbd>A</kbd>
                        <kbd class="key-z">Z</kbd>
                    </div>
                    <div class="arrow-key-cluster" aria-hidden="true">
                        <span class="keyboard-group-label">MOVEMENT</span>
                        <kbd class="arrow-up">↑</kbd>
                        <div class="arrow-key-row">
                            <kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd>
                        </div>
                    </div>
                </div>
                <p id="overlayPrompt" class="blink">PRESS A BUTTON TO PLAY</p>
            </div>

            <div id="demoBadge" class="demo-badge hidden" aria-hidden="true">
                <strong>DEMO MODE</strong>
                    <span>PRESS ARROWS / A / Z TO PLAY</span>
            </div>

            <p id="liveStatus" class="sr-only" aria-live="polite"></p>
        </section>

        <div class="game-toolbar">
            <p id="gameHint" class="game-hint" role="status" hidden></p>
            <button id="musicToggle" class="sound-toggle" type="button" aria-pressed="true">
                MUSIC: ON
            </button>
            <button id="soundToggle" class="sound-toggle" type="button" aria-pressed="true">
                SOUND: ON
            </button>
        </div>
    </main>

    <!-- Prototypen er selvstændig: de 2 motorfiler ligger lokalt i engine/. -->
    <script src="engine/hovorka.js?v=0.1.3"></script>
    <script src="engine/physiology-engine.js?v=0.1.3"></script>
    <script src="level-01.js?v=0.1.3"></script>
    <script src="level-02.js?v=0.1.3"></script>
    <script src="audio.js?v=0.1.4"></script>
    <script src="game.js?v=0.1.4-hd"></script>
</body>
</html>
